name: Build check

# Compiles every branch except main and keeps a test APK. Nothing is released from here;
# releases only come from release.yml on main.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Debug is the APK to try; release runs R8, which catches what debug can't.
      - name: Build
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: quote-widget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
